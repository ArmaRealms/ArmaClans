name: Publish to Modrinth
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK 25
      uses: actions/setup-java@v6.2.0
      with:
        java-version: 25
        cache: 'maven'
        distribution: 'temurin'
    - name: Install VentureChat
      run: ./mvnw -B org.apache.maven.plugins:maven-install-plugin:3.2.0:install-file -Dfile=libs/VentureChat-3.8.0.jar -DgroupId=mineverse.Aust1n46.chat -DartifactId=VentureChat -Dversion=3.8.0 -Dpackaging=jar
    - name: Build with Maven
      run: |
        ./mvnw -B package --file pom.xml
        cp target/SimpleClans-*.jar target/SimpleClans.jar
    - name: Upload artifact
      uses: RubixDev/modrinth-upload@v1.0.0
      with:
        token: ${{ secrets.MODRINTH_TOKEN }}
        project_id: quLDfyDl
        file_path: target/SimpleClans.jar
        changelog: ${{ github.event.release.body }}
        name: ${{ github.event.release.tag_name }}
        version: ${{ github.event.release.tag_name }}
        game_versions: '26.2'
        release_type: release
        loaders: paper
        featured: true
