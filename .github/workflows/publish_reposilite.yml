name: Publish to Reposilite
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          server-id: reposilite # Value of the distributionManagement/repository/id field of the pom.xml
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          cache: 'maven'
          distribution: 'temurin'
      - name: Install VentureChat
        run: ./mvnw -B org.apache.maven.plugins:maven-install-plugin:3.2.0:install-file -Dfile=libs/VentureChat-3.8.0.jar -DgroupId=mineverse.Aust1n46.chat -DartifactId=VentureChat -Dversion=3.8.0 -Dpackaging=jar
      - name: Publish to Reposilite
        run: ./mvnw -B deploy
        env:
          MAVEN_USERNAME: simpleclans
          MAVEN_PASSWORD: ${{ secrets.REPOSILITE_TOKEN }}
